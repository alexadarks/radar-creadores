<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Creadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#FFFFFF; --paper:#FFF4F1; --panel:#F7F9F9; --ink:#1B2323; --muted:#5E6666; --line:#EAD9D5;
  --coral:#F94D4F; --coral-soft:#FFE3E1; --teal:#013334; --teal-soft:#E3EEEC; --sky:#2EA3F2;
  --amber:#B86E00; --amber-soft:#FFF1D6; --good:#0E7C55; --good-soft:#DDF3EA;
  --p1:#F94D4F; --p2:#0E7C7B; --p3:#6B4FBB; --p4:#C27A00; --p5:#2E6FD8; --p0:#A3ABAA;
  --display:"Playfair Display", Georgia, serif;
  --body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Roboto Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1A1A; --paper:#172424; --panel:#142020; --ink:#F1ECEA; --muted:#A9B4B2; --line:#2A3A3A;
    --coral:#FF6A6B; --coral-soft:#3A1F20; --teal:#0B4A4B; --teal-soft:#1C3131; --sky:#5CB8F5;
    --amber:#F0B34A; --amber-soft:#3A2E16; --good:#4CC995; --good-soft:#163A2C;
    --p1:#FF6A6B; --p2:#3FB8B6; --p3:#A58BF0; --p4:#F0B34A; --p5:#6FA4F5; --p0:#5E6A69; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
a{color:var(--coral)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header.top{background:var(--teal);color:#fff;padding:20px 16px 16px;position:relative}
header.top .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);padding:3px 10px;font-size:12px}
header.top .chip[aria-pressed="true"]{background:#fff;color:var(--teal);border-color:#fff}
.top-in{max-width:1040px;margin:0 auto;display:grid;gap:6px}
.top h1{font-size:clamp(28px,5.5vw,40px);font-weight:900}
.top h1 em{font-style:italic;color:#FFB3B3}
.top .sub{opacity:.9;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 16px}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--coral)}

.view{display:grid;gap:20px;padding-top:18px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.sec-h h2{font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.box{border:1px solid var(--line);background:var(--bg);padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.box h3{font-size:18px}
.note{font-size:13px;color:var(--muted)}
.callout{background:var(--paper);border-left:4px solid var(--coral);padding:12px 14px;display:grid;gap:6px}
.callout.teal{background:var(--teal-soft);border-left-color:var(--p2)}
.callout.amber{background:var(--amber-soft);border-left-color:var(--amber)}

.btn{background:var(--coral);color:#fff;border:0;padding:9px 14px;cursor:pointer;font-weight:500;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.teal{background:var(--teal);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* form */
.form-sec{border:1px solid var(--line);display:grid;grid-template-columns:6px 1fr}
.form-sec .rail{background:var(--pc,var(--coral))}
.form-sec .in{padding:16px;display:grid;gap:14px}
.form-sec h3{font-size:20px}
.field{display:grid;gap:4px}
.field label{font-weight:500}
.field .help{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:2px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 10px;border-radius:99px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.rep{display:grid;gap:8px}
.rep-item{display:grid;gap:6px;grid-template-columns:1fr 1.4fr auto;align-items:start}
.rep-item.three{grid-template-columns:1fr .8fr 1.4fr auto}
@media (max-width:640px){.rep-item,.rep-item.three{grid-template-columns:1fr}}
.x{background:none;border:1px solid var(--line);cursor:pointer;padding:6px 10px}
.progress{height:8px;background:var(--panel);border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--good)}
.save-state{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.kpi{border:1px solid var(--line);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.kpi .lab{font-size:13px;color:var(--muted)}
.delta{font-family:var(--mono);font-size:12px}
.up{color:var(--good)} .down{color:var(--coral)}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:2px;white-space:nowrap}
.badge.g{background:var(--good-soft);border-color:transparent;color:var(--good)}
.badge.c{background:var(--coral-soft);border-color:transparent;color:var(--coral)}
.badge.a{background:var(--amber-soft);border-color:transparent;color:var(--amber)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 6px}
.t td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}

.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 70px;gap:8px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--panel);border:1px solid var(--line);position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--pc,var(--p2))}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}

.drop{border:2px dashed var(--line);padding:18px;text-align:center;display:grid;gap:8px;cursor:pointer;background:var(--panel)}
.drop.on{border-color:var(--sky)}
.status{font-size:13px}
.status.ok{color:var(--good)} .status.err{color:var(--coral)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.card{border:1px solid var(--line);display:grid;grid-template-columns:6px 1fr;min-width:0}
.card .rail{background:var(--pc,var(--coral))}
.card .in{padding:14px 16px;display:grid;gap:8px;align-content:start}
.card h3{font-size:18px}
.prose{white-space:pre-wrap}
.empty{border:1px dashed var(--line);padding:22px;text-align:center;display:grid;gap:8px;justify-items:center}
svg text{font-family:var(--body)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="mono" style="opacity:.8">Radar de creadores</span>
    <h1 id="h-title">Métricas y <em>tendencias</em></h1>
    <div class="row" role="group" aria-label="Idioma" data-notr style="position:absolute;top:14px;right:16px"><button type="button" class="chip" data-lang="es" aria-pressed="true">ES</button><button type="button" class="chip" data-lang="en" aria-pressed="false">EN</button></div>
    <div class="sub"><span id="h-brand">Completa tu marca para empezar</span><span id="h-period"></span></div>
  </div>
</header>
<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-tab="marca" aria-selected="true">Mi marca</button>
    <button class="tab" role="tab" data-tab="metricas" aria-selected="false">Métricas</button>
    <button class="tab" role="tab" data-tab="tendencias" aria-selected="false">Tendencias</button>
  </div>
</nav>
<main class="wrap">
  <div id="boot" class="view"><div class="empty"><h3>Abriendo tu radar…</h3><p class="note" id="boot-msg">Conectando con tu espacio privado.</p></div></div>
  <section id="v-marca" class="view" hidden></section>
  <section id="v-metricas" class="view" hidden></section>
  <section id="v-tendencias" class="view" hidden></section>
</main>

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"otro";
const fmt=(n,d=0)=>n==null||isNaN(n)?"–":Number(n).toLocaleString(LOC(),{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtK=n=>n==null||isNaN(n)?"–":(Math.abs(n)>=1e6?fmt(n/1e6,1)+(LANG==="en"?"M":" M"):Math.abs(n)>=1e4?fmt(n/1e3,1)+(LANG==="en"?"K":" mil"):fmt(n));
const pct=(n,d=1)=>n==null||isNaN(n)||!isFinite(n)?"–":fmt(n*100,d)+(LANG==="en"?"%":" %");
const num=v=>{if(v==null)return null;let s=String(v).trim().replace(/[\s% ]/g,"");if(!s||s==="-")return null;
  const hasD=s.includes("."),hasC=s.includes(",");
  if(hasD&&hasC){ if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,""); }
  else if(hasC){ s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,""):s.replace(",","."); }
  else if(hasD && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const n=parseFloat(s);return isNaN(n)?null:n;};
const delta=(a,b)=>(a==null||b==null||!b)?null:(a-b)/Math.abs(b);
const dHtml=(a,b,inv)=>{const d=delta(a,b);if(d==null)return '<span class="delta muted">sin período anterior</span>';
  const good=inv?d<0:d>0;return '<span class="delta '+(Math.abs(d)<0.005?"muted":good?"up":"down")+'">'+(d>0?"▲ ":d<0?"▼ ":"")+pct(Math.abs(d),0)+' vs. anterior</span>';};
const median=a=>{a=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;};
const fechaCorta=s=>{if(!s)return"";const d=new Date(s+"T12:00:00");return isNaN(d)?s:d.toLocaleDateString(LOC(),{day:"numeric",month:"short",year:"numeric"});};

function tr(t){if(LANG!=="en")return t;if(Object.prototype.hasOwnProperty.call(EN,t))return EN[t];for(const [re,f] of PAT){const m=t.match(re);if(m)return f(m);}return t;}
function trText(n){
  if(LANG!=="en"){if(n.__es!=null&&n.nodeValue===n.__en)n.nodeValue=n.__es;return;}
  const raw=n.nodeValue,src=(n.__es!=null&&raw===n.__en)?n.__es:raw,t=src.trim();if(!t||!/[A-Za-zÁÉÍÓÚáéíóúñ¿¡]/.test(t))return;
  const out=tr(t);if(out===t)return;const v=src.replace(t,out);n.__es=src;n.__en=v;if(n.nodeValue!==v)n.nodeValue=v;
}
function trEl(el){
  if(el.closest&&el.closest("[data-notr]"))return;
  for(const a of ["placeholder","aria-label","title"]){if(!el.hasAttribute||!el.hasAttribute(a))continue;el.__esA=el.__esA||{};el.__enA=el.__enA||{};
    const raw=el.getAttribute(a),src=(el.__esA[a]!=null&&raw===el.__enA[a])?el.__esA[a]:raw;
    if(LANG!=="en"){if(el.__esA[a]!=null&&raw===el.__enA[a])el.setAttribute(a,el.__esA[a]);continue;}
    const out=tr(src.trim());if(out!==src.trim()){el.__esA[a]=src;el.__enA[a]=out;if(raw!==out)el.setAttribute(a,out);}}
}
function trAll(root){
  if(!root)return;if(root.nodeType===3){if(!(root.parentElement&&root.parentElement.closest("[data-notr],script,style")))trText(root);return;}
  if(root.nodeType!==1)return;if(root.closest("[data-notr],script,style"))return;
  trEl(root);root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(trEl);
  const w=document.createTreeWalker(root,4,{acceptNode:n=>n.parentElement&&n.parentElement.closest("[data-notr],script,style")?2:1});let n;while(n=w.nextNode())trText(n);
}
let trObs=null;
function startI18n(){
  trObs=new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")trAll(m.target);else m.addedNodes.forEach(trAll);}});
  trObs.observe(document.body,{childList:true,subtree:true,characterData:true});
  setLang(LANG,true);
}
function setLang(l,first){

}

/* ---------- boot ---------- */
async function boot(){
  const tm=setTimeout(()=>{$("#boot-msg").textContent="Está tardando más de lo normal. Si no carga, revisa que hayas iniciado sesión en Claude.";},10000);
  const [db,user,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
  S.db=db;S.user=user;S.sample=sample;
  if(sample){try{S.imgs=!!(await sample.limits()).images}catch(e){}}
  if(!db||!user){clearTimeout(tm);$("#boot").innerHTML='<div class="empty"><h3>Necesitas iniciar sesión</h3><p class="note">El radar guarda tus datos en un espacio privado de tu cuenta de Claude. Abre esta página con tu sesión iniciada y con acceso de edición.</p></div>';return;}
  S.uid=await user.id();
  if(!S.uid){clearTimeout(tm);$("#boot-msg").textContent="No pudimos identificar tu cuenta.";return;}
  const base="data/users/"+S.uid;
  let first=true;
  db.doc(base+"/perfil").onSnapshot(s=>{
    clearTimeout(tm);
    if(!editing) S.perfil=s.exists?{...s.data()}:{};
    if(first){first=false;$("#boot").hidden=true;go(location.hash.slice(1)||(isPerfilVacio()?"marca":"metricas"));}
    else renderHeader();
  },e=>{clearTimeout(tm);$("#boot-msg").textContent="No se pudo abrir tu espacio ("+e.code+").";});
  db.doc(base+"/perfil").collection("periodos").onSnapshot(s=>{
    S.periodos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.hasta||"").localeCompare(a.hasta||""));
    if(!S.sel||!S.periodos.find(p=>p.id===S.sel)) S.sel=S.periodos[0]?.id||null;
    if(S.tab!=="marca") render();
    renderHeader();
  },e=>{});
}

let editing=false,saveT=null,saving=false,pendingSave=false;
function perfilProgreso(){
  let tot=0,ok=0;
  SECCIONES.forEach(s=>s.c.forEach(c=>{if(c.tipo==="check")return;tot++;const v=S.perfil[c.k];
    if(Array.isArray(v)?v.some(x=>typeof x==="string"?x:x&&(x.nombre||x.quien)):v!=null&&String(v).trim()!=="")ok++;}));
  return tot?ok/tot:0;
}
function renderMarca(){
  const v=$("#v-marca");const p=S.perfil;const prog=perfilProgreso();
  let h='<div class="sec"><div class="sec-h"><h2>Tu documento base</h2><span class="save-state" id="save-state">'+(p.updatedAt?"Guardado":"Se guarda solo mientras escribes")+'</span></div>'+
   '<p class="note">Responde con calma; no hace falta llenarlo todo de una vez. Con tu nicho, tus pilares y tu voz el radar ya puede cruzar tus métricas. Lo que escribas aquí es privado: solo tú lo ves.</p>'+
   '<div class="progress" aria-label="Avance"><i style="width:'+Math.round(prog*100)+'%"></i></div><span class="note">'+Math.round(prog*100)+' % completo</span></div>';
  SECCIONES.forEach((s,si)=>{
    h+='<div class="form-sec" style="--pc:'+PC[si%5]+'"><div class="rail"></div><div class="in"><div><h3>'+esc(s.t)+'</h3><p class="note">'+esc(s.i)+'</p></div>';
    s.c.forEach(c=>{h+=fieldHtml(c);});
    h+='</div></div>';
  });
  h+='<div class="box"><h3>Ficha de tu voz</h3><p class="note">Claude lee lo que escribiste y lo resume en una ficha corta. Se usa en Tendencias para que las ideas suenen a ti.</p>'+
     (p.ficha_voz?'<div class="callout teal prose">'+esc(p.ficha_voz)+'</div>':'')+
     '<div class="row"><button class="btn teal" id="b-ficha"'+(S.sample?'':' disabled')+'>'+(p.ficha_voz?"Actualizar ficha":"Crear mi ficha de voz")+'</button><span class="status" id="st-ficha">'+(S.sample?'':'La lectura con Claude no está disponible en esta vista.')+'</span></div></div>';
  v.innerHTML=h;
  bindMarca();
}
function fieldHtml(c){
  const p=S.perfil,val=p[c.k];
  const help=c.h?'<span class="help">'+esc(c.h)+'</span>':'';
  if(c.tipo==="text"||c.tipo==="number")return '<div class="field"><label for="f-'+c.k+'">'+esc(c.l)+'</label>'+help+'<input id="f-'+c.k+'" data-k="'+c.k+'" type="'+(c.tipo==="number"?"number":"text")+'" step="any" placeholder="'+esc(c.ph||"")+'" value="'+esc(val||"")+'"></div>';
  if(c.tipo==="textarea")return '<div class="field"><label for="f-'+c.k+'">'+esc(c.l)+'</label>'+help+'<textarea id="f-'+c.k+'" data-k="'+c.k+'" placeholder="'+esc(c.ph||"")+'">'+esc(val||"")+'</textarea></div>';
  if(c.tipo==="select")return '<div class="field"><label for="f-'+c.k+'">'+esc(c.l)+'</label>'+help+'<select id="f-'+c.k+'" data-k="'+c.k+'"><option value="">Elige uno</option>'+c.op.map(o=>'<option value="'+esc(o)+'"'+(o===val?" selected":"")+'>'+esc(o)+'</option>').join("")+'</select></div>';
  if(c.tipo==="chips"||c.tipo==="chips1"){const arr=Array.isArray(val)?val:(val?[val]:[]);
    return '<div class="field"><span style="font-weight:500">'+esc(c.l)+'</span>'+help+'<div class="chips" data-chips="'+c.k+'" data-one="'+(c.tipo==="chips1"?1:0)+'">'+c.op.map(o=>'<button type="button" class="chip" aria-pressed="'+arr.includes(o)+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div></div>';}
  if(c.tipo==="check")return '<label class="row" style="align-items:flex-start;gap:10px"><input type="checkbox" data-k="'+c.k+'"'+(val?" checked":"")+' style="margin-top:4px"><span><b>'+esc(c.l)+'.</b> '+esc(c.txt)+'</span></label>';
  if(c.tipo==="pilares"){const arr=Array.isArray(val)&&val.length?val:[{},{},{}];
    return '<div class="rep" data-rep="pilares">'+arr.map((x,i)=>'<div class="rep-item" data-i="'+i+'"><input type="text" data-f="nombre" placeholder="Pilar '+(i+1)+' (ej: Recetas rápidas)" value="'+esc(x.nombre||"")+'"><input type="text" data-f="palabras" placeholder="Palabras clave: receta, almuerzo, 15 minutos…" value="'+esc(x.palabras||"")+'"><button type="button" class="x" data-del aria-label="Quitar pilar">✕</button></div>').join("")+
     (arr.length<5?'<button type="button" class="btn ghost" data-add="pilares">+ Agregar pilar</button>':'')+'</div>';}
  if(c.tipo==="referentes"){const arr=Array.isArray(val)&&val.length?val:[{}];
    return '<div class="field"><span style="font-weight:500">'+esc(c.l)+'</span><span class="help">Cuentas que admiras o con las que compites. Su nombre ayuda a detectar en Google cuando te buscan junto a ellas.</span><div class="rep" data-rep="referentes">'+arr.map((x,i)=>'<div class="rep-item three" data-i="'+i+'"><input type="text" data-f="quien" placeholder="@cuenta o nombre" value="'+esc(x.quien||"")+'"><input type="text" data-f="plataforma" placeholder="Plataforma" value="'+esc(x.plataforma||"")+'"><input type="text" data-f="porque" placeholder="¿Qué te interesa de ella?" value="'+esc(x.porque||"")+'"><button type="button" class="x" data-del aria-label="Quitar">✕</button></div>').join("")+
     (arr.length<6?'<button type="button" class="btn ghost" data-add="referentes">+ Agregar referente</button>':'')+'</div></div>';}
  return "";
}
function collectRep(name){
  const box=document.querySelector('[data-rep="'+name+'"]');if(!box)return S.perfil[name]||[];
  return [...box.querySelectorAll(".rep-item")].map(it=>{const o={};it.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim());return o;});
}
function bindMarca(){
  const v=$("#v-marca");
  v.querySelectorAll("input[data-k],textarea[data-k],select[data-k]").forEach(el=>{
    const ev=el.tagName==="SELECT"||el.type==="checkbox"?"change":"input";
    el.addEventListener(ev,()=>{S.perfil[el.dataset.k]=el.type==="checkbox"?el.checked:el.type==="number"?(el.value===""?null:Number(el.value)):el.value;queueSave(el.type==="checkbox"||el.tagName==="SELECT");});
    el.addEventListener("focus",()=>editing=true);el.addEventListener("blur",()=>editing=false);
  });
  v.querySelectorAll("[data-chips]").forEach(box=>box.addEventListener("click",e=>{
    const b=e.target.closest(".chip");if(!b)return;const k=box.dataset.chips,one=box.dataset.one==="1";
    let arr=Array.isArray(S.perfil[k])?[...S.perfil[k]]:(S.perfil[k]?[S.perfil[k]]:[]);
    if(one){arr=arr.includes(b.dataset.v)?[]:[b.dataset.v];S.perfil[k]=arr[0]||"";box.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===S.perfil[k]));}
    else{arr=arr.includes(b.dataset.v)?arr.filter(x=>x!==b.dataset.v):[...arr,b.dataset.v];S.perfil[k]=arr;b.setAttribute("aria-pressed",arr.includes(b.dataset.v));}
    queueSave(true);}));
  v.querySelectorAll("[data-rep]").forEach(box=>{
    const name=box.dataset.rep;
    box.addEventListener("input",e=>{if(e.target.dataset.f){S.perfil[name]=collectRep(name);queueSave();}});
    box.addEventListener("focusin",()=>editing=true);box.addEventListener("focusout",()=>editing=false);
    box.addEventListener("click",e=>{
      if(e.target.closest("[data-add]")){S.perfil[name]=[...collectRep(name),{}];queueSave(true);renderMarca();}
      else if(e.target.closest("[data-del]")){const i=+e.target.closest(".rep-item").dataset.i;const a=collectRep(name);a.splice(i,1);S.perfil[name]=a;queueSave(true);renderMarca();}
    });
  });
  const bf=$("#b-ficha");if(bf)bf.addEventListener("click",crearFicha);
}
function queueSave(now){clearTimeout(saveT);const st=$("#save-state");if(st)st.textContent="Guardando…";saveT=setTimeout(doSave,now?100:1200);}
async function doSave(){
  if(saving){pendingSave=true;return;}
  saving=true;
  try{S.perfil.updatedAt=new Date().toISOString();await S.db.doc("data/users/"+S.uid+"/perfil").set(clean(S.perfil));
    const st=$("#save-state");if(st)st.textContent="Guardado";renderHeader();
    if(S.perfil.compartir) pushBench(); else removeBench();
  }catch(e){const st=$("#save-state");if(st)st.textContent=e.code==="invalid_argument"?"No tienes permiso de edición en esta página":"No se pudo guardar ("+e.code+")";}
  saving=false;if(pendingSave){pendingSave=false;doSave();}
}
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>v===undefined?null:v));
function perfilTexto(full){
  const p=S.perfil,L=[];
  const add=(l,v)=>{if(v&&(!Array.isArray(v)||v.length))L.push(l+": "+(Array.isArray(v)?v.join(", "):v));};
  add("Marca",p.marca);add("Se presenta como",p.frase);add("Nicho",p.nicho);add("Subnicho",p.subnicho);add("Mercado",p.mercado);add("Diferencia",p.diferencia);
  add("Plataformas",p.plataformas);add("Audiencia",p.para_quien);add("Le preocupa o desea",p.problemas);add("Busca antes de encontrarla",p.busca);
  add("Objetivo",p.objetivo);add("Vende",p.vendo);
  const pil=pilares();if(pil.length)L.push("Pilares: "+pil.map(x=>x.nombre+(x.kw.length?" ("+x.kw.join(", ")+")":"")).join("; "));
  if(full){add("Voz en tres palabras",p.adjetivos);add("Así sí suena",p.si_suena);add("Así no suena",p.no_suena);add("Temas que no toca",p.tabu);if(p.ejemplo)L.push("Texto de ejemplo real:\n"+String(p.ejemplo).slice(0,2500));}
  else if(p.ficha_voz) L.push("Ficha de voz:\n"+p.ficha_voz);
  const ref=(p.referentes||[]).filter(r=>r.quien);if(ref.length)L.push("Referentes: "+ref.map(r=>r.quien+(r.porque?" ("+r.porque+")":"")).join("; "));
  add("Quiere comparar",p.comparar);add("Preguntas que quiere responder",p.preguntas);
  return L.join("\n");
}
async function crearFicha(){
  const st=$("#st-ficha"),b=$("#b-ficha");b.disabled=true;st.className="status";st.textContent="Claude está leyendo tu marca…";
  try{
    const r=await S.sample("Eres estratega de contenido. A partir de este documento de marca de una creadora de contenido, escribe una ficha de voz de máximo 120 palabras: cómo habla, recursos que usa, palabras o giros típicos, qué evitar y cómo trata a su audiencia. Basa todo en lo que ella escribió, sin inventar. "+noTics()+" Devuelve solo la ficha, en texto plano con viñetas simples (•).\n\n"+perfilTexto(true),{modelTier:"default"});
    S.perfil.ficha_voz=r.text.trim();await doSave();renderMarca();
  }catch(e){st.className="status err";st.textContent=e.code==="rate_limited"?"Demasiadas solicitudes seguidas; prueba en un minuto.":"No se pudo crear la ficha.";b.disabled=false;}
}
function pilares(){return (S.perfil.pilares||[]).filter(x=>x&&x.nombre&&x.nombre.trim()).map((x,i)=>({nombre:x.nombre.trim(),kw:[x.nombre,...String(x.palabras||"").split(",")].map(norm).filter(w=>w.length>2),color:PC[i%5]}));}
function brandTokens(){const p=S.perfil;return [p.marca,...String(p.handles||"").split(",")].map(s=>norm(s).replace(/^@/,"")).filter(s=>s.length>2).flatMap(s=>[s,s.replace(/[\s._-]+/g,"")]);}
function classify(text){const t=norm(text);for(const p of pilares()){if(p.kw.some(k=>t.includes(k)))return p.nombre;}return null;}
const isBrand=q=>{const t=norm(q),tc=t.replace(/[\s._-]+/g,"");return brandTokens().some(b=>t.includes(b)||tc.includes(b));};

  z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("on");});

Por fila:

headers: si se ven los títulos de las columnas, ponlos en el mismo orden que valores (sin la fecha); si no se ven, null en cada posición.

  try{
    const r=await S.sample.json(prompt,{images:imgs,modelTier:"default"});
    const rows=(r.rows||[]).filter(x=>x&&x.titulo!=null).map(x=>({titulo:String(x.titulo).trim(),formato:String(x.formato||""),cuenta:x.cuenta?String(x.cuenta).replace(/^@/,""):"",red:x.red||"",fecha:x.fecha||"",valores:(x.valores||[]).map(v=>v==null||isNaN(v)?null:Number(v))}));

    renderMetricas();
  }catch(e){st.className="status err";st.textContent=e.code==="rate_limited"?"Demasiadas solicitudes; espera un minuto.":"No pude leer la tabla. Prueba con capturas más nítidas o de menos filas.";}
}

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error("zip");
  const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);const out=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const flags=dv.getUint16(off+8,true),method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder(flags&0x800?"utf-8":"utf-8").decode(u8.subarray(off+46,off+46+nl));
    off+=46+nl+xl+cl;
    if(name.endsWith("/"))continue;
    const ds=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    const raw=u8.slice(ds,ds+csize);let data;
    if(method===0)data=raw;
    else if(method===8)data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else continue;
    out.push({name,text:new TextDecoder("utf-8").decode(data)});
  }
  return out;
}
function parseCSV(t){
  t=t.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;
  const sep=(()=>{const l=t.split("\n")[0]||"";return (l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?";":(l.includes("\t")?"\t":",");})();
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===sep){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function gscTable(text){
  const rows=parseCSV(text);if(rows.length<2)return null;
  const hd=rows[0].map(norm);const first=hd[0];
  let kind=null;
  if(/consulta|query|queries/.test(first))kind="consultas";else if(/pagina|page|publicacion|post|video/.test(first))kind="paginas";
  else if(/pais|country/.test(first))kind="paises";else if(/dispositivo|device/.test(first))kind="dispositivos";
  else if(/fecha|date/.test(first))kind="fechas";
  if(!kind)return null;
  const col=re=>hd.findIndex((h,i)=>i>0&&re.test(h));
  const ic=col(/clic|click/),ii=col(/impres/),it=col(/ctr/),ip=col(/posic|position/);
  const data=rows.slice(1).map(r=>({k:r[0],clics:num(r[ic])||0,impresiones:num(r[ii])||0,ctr:it>=0?(num(r[it])||0)/100:null,pos:ip>=0?num(r[ip]):null})).filter(r=>r.k);
  data.forEach(r=>{if(r.ctr==null)r.ctr=r.impresiones?r.clics/r.impresiones:0;});
  return {kind,data};
}
const PLAT={blog:{n:"Blog / sitio",c:"var(--p2)"},instagram:{n:"Instagram",c:"var(--p1)"},tiktok:{n:"TikTok",c:"var(--p3)"},youtube:{n:"YouTube",c:"var(--p4)"},facebook:{n:"Facebook",c:"var(--p5)"}};

function platDeUrl(u){const s=String(u||"").toLowerCase();if(/instagram\.com/.test(s))return"instagram";if(/tiktok\.com/.test(s))return"tiktok";if(/youtube\.com|youtu\.be/.test(s))return"youtube";if(/facebook\.com|fb\.watch/.test(s))return"facebook";return s.startsWith("http")?"blog":null;}
function platDeNombre(n){const s=norm(n);if(/instagram|\big\b/.test(s))return"instagram";if(/tiktok/.test(s))return"tiktok";if(/youtube|\byt\b/.test(s))return"youtube";if(/facebook/.test(s))return"facebook";if(/blog|sitio|web/.test(s))return"blog";return null;}
function gscGrupo(texts,nombre){
  const g={consultas:[],paginas:[],paises:[],dispositivos:[],fechas:[],apariencia:[]};let found=0;
  for(const t of texts){const n=norm(t.name);
    if(/aparicion|appearance/.test(n)){const tb=gscTable(t.text.replace(/^[^\n,]*/,"Fecha"));if(tb){g.apariencia=tb.data;}continue;}
    const tb=gscTable(t.text);if(tb){g[tb.kind]=tb.data;found++;}}
  if(!found)return null;
  g.consultas=g.consultas.sort((a,b)=>b.impresiones-a.impresiones).slice(0,250);
  g.paginas=g.paginas.sort((a,b)=>b.clics-a.clics||b.impresiones-a.impresiones).slice(0,80);
  g.paises=g.paises.sort((a,b)=>b.impresiones-a.impresiones).slice(0,30);
  g.fechas=g.fechas.sort((a,b)=>a.k.localeCompare(b.k));
  const src=g.fechas.length?g.fechas:(g.dispositivos.length?g.dispositivos:g.paises.length?g.paises:g.consultas);
  const c=src.reduce((s,r)=>s+r.clics,0),i=src.reduce((s,r)=>s+r.impresiones,0);
  g.tot={clics:c,impresiones:i,ctr:i?c/i:0,pos:src.reduce((s,r)=>s+(r.pos||0)*r.impresiones,0)/(i||1)};
  if(g.fechas.length){g.desde=g.fechas[0].k.slice(0,10);g.hasta=g.fechas[g.fechas.length-1].k.slice(0,10);}

async function entradasDeDrop(dt){

    if(e.isDirectory){const fs=[];const walk=async d=>{for(const x of await leerDir(d)){if(x.isDirectory)await walk(x);else{const f=await archivo(x);if(f)fs.push(f);}}};await walk(e);grupos.push({nombre:e.name,files:fs});}

function mergeGsc(gp){
  const ks=Object.keys(gp);const sum=(rows)=>{const m=new Map();rows.forEach(([pl,r])=>{const k=norm(r.k);let o=m.get(k);if(!o){o={k:r.k,clics:0,impresiones:0,pw:0,pl:[]};m.set(k,o);}o.clics+=r.clics;o.impresiones+=r.impresiones;o.pw+=(r.pos||0)*r.impresiones;if(!o.pl.includes(pl))o.pl.push(pl);});
    return [...m.values()].map(o=>({k:o.k,clics:o.clics,impresiones:o.impresiones,ctr:o.impresiones?o.clics/o.impresiones:0,pos:o.impresiones?o.pw/o.impresiones:null,pl:o.pl.join(",")}));};
  const cat=key=>ks.flatMap(pl=>(gp[pl][key]||[]).map(r=>[pl,r]));
  const g={consultas:sum(cat("consultas")).sort((a,b)=>b.impresiones-a.impresiones).slice(0,500),
    paginas:cat("paginas").map(([pl,r])=>({...r,pl})).sort((a,b)=>b.clics-a.clics||b.impresiones-a.impresiones).slice(0,120),
    paises:sum(cat("paises")).sort((a,b)=>b.impresiones-a.impresiones).slice(0,30),dispositivos:sum(cat("dispositivos")),fechas:sum(cat("fechas")).sort((a,b)=>a.k.localeCompare(b.k))};
  const c=ks.reduce((s,k)=>s+gp[k].tot.clics,0),i=ks.reduce((s,k)=>s+gp[k].tot.impresiones,0);
  g.tot={clics:c,impresiones:i,ctr:i?c/i:0,pos:ks.reduce((s,k)=>s+gp[k].tot.pos*gp[k].tot.impresiones,0)/(i||1)};
  g.rangos_distintos=new Set(rangos(gp)).size>1;
  return g;
}

function calc(P,gOv){
  if(!P)return null;
  const m=P.meta||{},ig=m.ig||{},fb=m.fb||{},g=gOv||P.gsc;
  const r={};
  [["ig",ig],["fb",fb]].forEach(([n,o])=>{
    const has=v=>v!=null&&!isNaN(v);
    r[n+"_netos"]=has(o.seguimientos)?o.seguimientos-(o.dejaron||0):null;
    r[n+"_crec"]=r[n+"_netos"]!=null&&o.seguidores_total?r[n+"_netos"]/Math.max(1,o.seguidores_total-r[n+"_netos"]):null;
    r[n+"_er"]=has(o.interacciones)&&o.espectadores?o.interacciones/o.espectadores:null;
    r[n+"_desc"]=has(o.pct_vis_no_seg)?o.pct_vis_no_seg/100:null;
    r[n+"_conv"]=has(o.seguimientos)&&o.visitas?o.seguimientos/o.visitas:null;
    r[n+"_churn"]=has(o.dejaron)&&o.seguimientos?o.dejaron/o.seguimientos:null;
    r[n+"_vpe"]=has(o.visualizaciones)&&o.espectadores?o.visualizaciones/o.espectadores:null;
  });
  r.fb_repro=fb.reproducciones_3s!=null&&fb.visualizaciones?fb.reproducciones_3s/fb.visualizaciones:null;
  if(g){
    r.gsc=g.tot;
    const bq=g.consultas.filter(q=>isBrand(q.k));
    r.brand_share=g.consultas.length?bq.reduce((s,q)=>s+q.clics,0)/(g.consultas.reduce((s,q)=>s+q.clics,0)||1):null;
    const pil={};g.consultas.forEach(q=>{const c=classify(q.k)||"Sin pilar";pil[c]=pil[c]||{clics:0,impresiones:0,n:0};pil[c].clics+=q.clics;pil[c].impresiones+=q.impresiones;pil[c].n++;});
    r.pilares=pil;
    const expTop=0.12;
    r.oport=g.consultas.filter(q=>q.pos!=null&&q.pos>=3.5&&q.pos<=20&&q.impresiones>=10&&!isBrand(q.k)).map(q=>({...q,gana:Math.max(0,Math.round(q.impresiones*expTop-q.clics))})).filter(q=>q.gana>0).sort((a,b)=>b.gana-a.gana).slice(0,12);
  }
  if(m.top&&m.top.length){const pt={};m.top.forEach(t=>{const c=classify(t.titulo)||"Sin pilar";pt[c]=(pt[c]||0)+(t.visualizaciones??pzBase(t)??1);});r.top_pil=pt;}
  return r;
}

function piezasHtml(top){

  const rows=top.slice(0,15);
  let s='<div class="sec"><div class="sec-h"><h2>Tus piezas</h2><span class="note">'+top.length+' piezas · ordenadas por visualizaciones</span></div><div class="box"><div class="scroll"><table class="t"><tr><th>Pieza</th><th>Formato</th><th>Pilar</th><th class="n">Visualiz.</th><th class="n">Alcance</th><th class="n">Interacción</th><th class="n">Tasa</th></tr>'+
   rows.map(t=>'<tr><td>'+esc(t.titulo)+(t.cuenta?' <span class="note">@'+esc(t.cuenta)+'</span>':'')+(t.fecha?'<br><span class="note">'+esc(fechaCorta(t.fecha))+'</span>':'')+'</td><td class="note">'+esc(t.formato||"")+'</td><td class="note">'+esc(classify(t.titulo)||"–")+'</td><td class="n">'+fmtK(t.visualizaciones)+'</td><td class="n">'+fmtK(pzBase(t))+'</td><td class="n">'+fmtK(pzInt(t))+'</td><td class="n">'+pct(er(t))+'</td></tr>').join("")+'</table></div>'+
   (pzBase(top[0])!=null?'<p class="note">Tasa = interacción ÷ alcance (o espectadores).</p>':'')+'</div>';
  // por formato y por cuenta
  const grp=k=>{const g={};top.forEach(t=>{const key=t[k]||"–";g[key]=g[key]||{n:0,v:0,b:0,i:0};g[key].n++;g[key].v+=t.visualizaciones||0;g[key].b+=pzBase(t)||0;g[key].i+=pzInt(t)||0;});return Object.entries(g).sort((a,b)=>b[1].v-a[1].v);};
  const tab=(tit,arr)=>'<div class="box"><h3>'+tit+'</h3><div class="scroll"><table class="t"><tr><th></th><th class="n">Piezas</th><th class="n">Visualiz. promedio</th><th class="n">Tasa</th></tr>'+arr.map(([k,x])=>'<tr><td>'+esc(k)+'</td><td class="n">'+x.n+'</td><td class="n">'+fmtK(Math.round(x.v/x.n))+'</td><td class="n">'+(x.b?pct(x.i/x.b):"–")+'</td></tr>').join("")+'</table></div></div>';
  const f=grp("formato"),c=grp("cuenta");
  if(f.length>1||c.length>1)s+='<div class="grid2">'+(f.length>1?tab("Por formato",f):'')+(c.length>1?tab("Por cuenta",c):'')+'</div>';
  // concentración
  const tv=top.reduce((a,t)=>a+(t.visualizaciones||0),0);
  if(tv&&top.length>=5){const t3=top.slice().sort((a,b)=>(b.visualizaciones||0)-(a.visualizaciones||0)).slice(0,3).reduce((a,t)=>a+(t.visualizaciones||0),0)/tv;
    s+='<div class="callout'+(t3>0.7?' amber':' teal')+'"><p><b>'+pct(t3,0)+' de tus visualizaciones vienen de tus 3 mejores piezas.</b> '+(t3>0.7?'Tu alcance depende de pocos aciertos: vale la pena entender qué tienen en común y repetirlo.':'Tu alcance está bien repartido entre varias piezas.')+'</p></div>';}
  return s+'</div>';
}
function etiquetaUrl(u){try{const x=new URL(u),pth=x.pathname.replace(/\/$/,"");const pl=platDeUrl(u);
  if(pl==="instagram"){const m=pth.match(/\/(reel|p|tv)\/([^/]+)/);return m?(m[1]==="p"?(LANG==="en"?"Post ":"Publicación "):"Reel ")+m[2].slice(0,8):(LANG==="en"?"Profile ":"Perfil ")+pth.split("/")[1];}
  if(pl==="tiktok"){const m=pth.match(/\/video\/(\d+)/);return m?"Video …"+m[1].slice(-6):pth;}
  if(pl==="youtube"){const m=pth.match(/\/shorts\/([^/]+)/)||x.search.match(/v=([^&]+)/);return m?(pth.includes("shorts")?"Short ":"Video ")+m[1]:pth;}
  return decodeURIComponent(pth||"/").replace(/[-_]/g," ").slice(0,70)||"/";}catch(e){return String(u).slice(0,60);}}
function tablaContenido(rows,sel){return '<div class="box"><h3>Contenido con más clics</h3><div class="scroll"><table class="t"><tr><th>Contenido</th>'+(sel?'':'<th>Canal</th>')+'<th class="n">Clics</th><th class="n">Impr.</th><th class="n">Pos.</th></tr>'+
  rows.map(x=>'<tr><td><a href="'+esc(x.k)+'" target="_blank" rel="noopener">'+esc(etiquetaUrl(x.k))+'</a></td>'+(sel?'':'<td class="note">'+esc(platN(x.pl||platDeUrl(x.k)||""))+'</td>')+'<td class="n">'+fmt(x.clics)+'</td><td class="n">'+fmtK(x.impresiones)+'</td><td class="n">'+fmt(x.pos,1)+'</td></tr>').join("")+'</table></div><p class="note">Abre el enlace para ver la pieza que Google está mostrando.</p></div>';}
function tabla(t,rows,pil){return '<div class="box"><h3>'+esc(t)+'</h3><div class="scroll"><table class="t"><tr><th>'+(pil?"Búsqueda":"Página")+'</th><th class="n">Clics</th><th class="n">Impr.</th><th class="n">Pos.</th></tr>'+
  rows.map(x=>'<tr><td>'+esc(x.k)+(pil&&isBrand(x.k)?' <span class="badge">tu nombre</span>':'')+(x.pl&&String(x.pl).includes(",")?'<br><span class="note">'+esc(String(x.pl).split(",").map(platN).join(" · "))+'</span>':'')+'</td><td class="n">'+fmt(x.clics)+'</td><td class="n">'+fmtK(x.impresiones)+'</td><td class="n">'+fmt(x.pos,1)+'</td></tr>').join("")+'</table></div></div>';}
function bars(t,rows){const tot=rows.reduce((s,x)=>s+x.clics,0)||1;return '<div class="box"><h3>'+esc(t)+'</h3><div class="bars">'+rows.map(x=>'<div class="bar"><span>'+esc(x.k)+'</span><span class="track"><span class="fill" style="width:'+(x.clics/tot*100)+'%"></span></span><span class="v">'+pct(x.clics/tot,0)+'</span></div>').join("")+'</div><span class="note">% de clics</span></div>';}
function lineChart(rows){
  const W=900,H=200,pl=44,pr=44,pt=12,pb=26;const n=rows.length;
  const mc=Math.max(1,...rows.map(r=>r.clics)),mi=Math.max(1,...rows.map(r=>r.impresiones));
  const x=i=>pl+(W-pl-pr)*i/(n-1),yc=v=>pt+(H-pt-pb)*(1-v/mc),yi=v=>pt+(H-pt-pb)*(1-v/mi);
  const path=(f,k)=>rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+f(r[k]).toFixed(1)).join(" ");
  const lab=[0,Math.floor((n-1)/2),n-1].map(i=>'<text x="'+x(i)+'" y="'+(H-6)+'" font-size="12" fill="var(--muted)" text-anchor="'+(i===0?"start":i===n-1?"end":"middle")+'">'+esc(fechaCorta(rows[i].k.slice(0,10)))+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Clics e impresiones diarias"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'+
   '<path d="'+path(yi,"impresiones")+'" fill="none" stroke="var(--p0)" stroke-width="2"/><path d="'+path(yc,"clics")+'" fill="none" stroke="var(--coral)" stroke-width="2.5"/>'+
   '<text x="'+(pl-6)+'" y="'+(pt+10)+'" font-size="12" fill="var(--coral)" text-anchor="end">'+fmtK(mc)+'</text><text x="'+(W-pr+6)+'" y="'+(pt+10)+'" font-size="12" fill="var(--muted)">'+fmtK(mi)+'</text>'+lab+'</svg>'+
   '<div class="legend"><span><i style="background:var(--coral)"></i>Clics (eje izq.)</span><span><i style="background:var(--p0)"></i>Impresiones (eje der.)</span></div>';
}

function benchPayload(){const P=S.periodos[0];const r=calc(P);if(!r)return null;
  return clean({nicho:slug(S.perfil.nicho||""),periodo:P.hasta,ig_er:r.ig_er,ig_crec:r.ig_crec,ig_desc:r.ig_desc,ig_churn:r.ig_churn,ig_conv:r.ig_conv,fb_er:r.fb_er,fb_desc:r.fb_desc,fb_crec:r.fb_crec,gsc_ctr:r.gsc?.ctr??null,gsc_pos:r.gsc?.pos??null,brand_share:r.brand_share??null,at:new Date().toISOString()});}

async function cargarBench(){
  if(!S.perfil.nicho)return;S.bench="loading";
  try{const s=await S.db.collection("bench").where("nicho","==",slug(S.perfil.nicho)).limit(500).get();
    S.bench=s.docs.filter(d=>d.id!==S.uid).map(d=>d.data());}catch(e){S.bench=[];}
  if(S.tab==="metricas")renderMetricas();
}
function benchHtml(r){
  const p=S.perfil;

  if(!p.compartir) return h+'<div class="callout teal"><p>Activa el benchmark anónimo al final de <a href="#marca">Mi marca</a> para comparar tus tasas con otras creadoras de tu nicho. Solo se comparten porcentajes, nunca tu nombre ni tus números absolutos.</p></div></div>';
  if(S.bench==="loading"||S.bench===null) return h+'<p class="note">Cargando el nicho…</p></div>';
  const b=S.bench;
  if(b.length<3) return h+'<div class="callout teal"><p>Hay '+b.length+' creadora'+(b.length===1?'':'s')+' más de tu nicho aportando datos. El benchmark aparece cuando sean al menos 3, para que nadie quede identificable.</p></div></div>';
  const rowsDef=[["Tasa de interacción IG","ig_er"],["Crecimiento IG","ig_crec"],["Descubrimiento IG (no seguidores)","ig_desc"],["Bajas por cada nuevo IG","ig_churn",true],["Visitas que se vuelven seguidores IG","ig_conv"],["Tasa de interacción FB","fb_er"],["Descubrimiento FB","fb_desc"],["Crecimiento FB","fb_crec"],["CTR en Google","gsc_ctr"],["Posición media en Google","gsc_pos",true],["Búsquedas por tu nombre","brand_share"]];
  const tr=rowsDef.map(([l,k,inv])=>{const me=k==="gsc_ctr"?r.gsc?.ctr:k==="gsc_pos"?r.gsc?.pos:r[k];const md=median(b.map(x=>x[k]));if(md==null||me==null)return"";
    const better=inv?me<md:me>md;return '<tr><td>'+esc(l)+'</td><td class="n"><b>'+(k==="gsc_pos"||k==="ig_churn"?fmt(me,k==="gsc_pos"?1:2):pct(me))+'</b></td><td class="n">'+(k==="gsc_pos"||k==="ig_churn"?fmt(md,k==="gsc_pos"?1:2):pct(md))+'</td><td><span class="badge '+(better?"g":"a")+'">'+(better?"Sobre el nicho":"Bajo el nicho")+'</span></td></tr>';}).join("");
  return h+'<div class="box"><div class="scroll"><table class="t"><tr><th>Métrica</th><th class="n">Tú</th><th class="n">Mediana del nicho</th><th></th></tr>'+(tr||'<tr><td colspan="4" class="note">Aún no hay métricas en común para comparar.</td></tr>')+'</table></div><p class="note">Basado en '+b.length+' creadoras del nicho, con su período más reciente. <button class="btn ghost" id="b-bench" style="padding:3px 8px">Actualizar</button></p></div></div>';
}

/* ---------- lectura cruzada ---------- */
function resumenDatos(P){
  const r=calc(P),Q=prevOf(P),q=calc(Q),m=P.meta||{},L=[];
  L.push("Período: "+P.desde+" a "+P.hasta+(Q?" (comparado con "+Q.desde+" a "+Q.hasta+")":""));
  const fx=(o,F,n)=>{const e=F.filter(([k])=>o&&o[k]!=null).map(([k,l])=>l+": "+o[k]);if(e.length)L.push(n+": "+e.join("; "));};
  fx(m.ig,IG_F,"Instagram");fx(m.fb,FB_F,"Facebook");if(Q)fx(Q.meta?.ig,IG_F,"Instagram período anterior");
  ["ig","fb"].forEach(n=>{const o=m[n]||{};const v=Object.entries(o).filter(([k,x])=>k.startsWith("var_")&&x!=null).map(([k,x])=>k.slice(4)+" "+(x>0?"+":"")+x+"%");if(v.length)L.push((n==="ig"?"Instagram":"Facebook")+" variación vs. período anterior según Meta: "+v.join("; "));
    const d=[["tasa de interacción (interacciones/espectadores)",r[n+"_er"]],["descubrimiento (% visualizaciones de no seguidores)",r[n+"_desc"]],["crecimiento neto",r[n+"_crec"]],["visitas que se vuelven seguidores",r[n+"_conv"]]].filter(x=>x[1]!=null).map(([l,x])=>l+" "+pct(x,2));
    if(r[n+"_netos"]!=null)d.push("seguimientos netos "+r[n+"_netos"]);if(r[n+"_churn"]!=null)d.push("bajas por cada nuevo "+fmt(r[n+"_churn"],2));
    if(d.length)L.push((n==="ig"?"Instagram":"Facebook")+" calculado: "+d.join("; "));});
  if(m.top?.length)L.push("Piezas ("+m.top.length+", ordenadas por visualizaciones): "+m.top.slice(0,20).map(t=>t.titulo.slice(0,90)+" ["+[t.formato,t.cuenta&&"@"+t.cuenta,t.fecha,t.visualizaciones!=null&&"visualizaciones "+t.visualizaciones,pzBase(t)!=null&&"alcance "+pzBase(t),pzInt(t)!=null&&"interacciones "+pzInt(t),t.compartidos!=null&&"compartidos "+t.compartidos,t.guardados!=null&&"guardados "+t.guardados,"pilar "+(classify(t.titulo)||"sin pilar")].filter(Boolean).join(", ")+"]").join("; "));
  if(P.gsc){const g=P.gsc;L.push("Google: "+g.tot.clics+" clics, "+g.tot.impresiones+" impresiones, CTR "+pct(g.tot.ctr)+", posición "+fmt(g.tot.pos,1)+(Q?.gsc?" (antes "+Q.gsc.tot.clics+" clics, "+Q.gsc.tot.impresiones+" impresiones)":""));
    if(r.brand_share!=null)L.push("Clics de búsquedas con su nombre: "+pct(r.brand_share,0));
    if(P.gscp){Object.entries(P.gscp).forEach(([k,x])=>{const qx=Q?.gscp?.[k];L.push("Google canal "+platN(k)+" ("+x.desde+" a "+x.hasta+"): "+x.tot.clics+" clics, "+x.tot.impresiones+" impresiones, CTR "+pct(x.tot.ctr,2)+", posición "+fmt(x.tot.pos,1)+(qx?" (antes "+qx.tot.clics+" clics)":"")+". Top búsquedas: "+x.consultas.slice(0,8).map(c=>c.k+" ("+c.impresiones+" impr)").join("; ")+". Top contenido: "+x.paginas.slice(0,5).map(c=>etiquetaUrl(c.k)+" ("+c.clics+" clics)").join("; "));});
      if(P.gsc.rangos_distintos)L.push("ADVERTENCIA: los canales de Google tienen rangos de fechas distintos; no sumes ni compares totales entre canales sin decirlo.");
      if(P.gscp.blog){const sin=P.gsc.consultas.filter(c=>c.impresiones>=15&&!isBrand(c.k)&&!String(c.pl).includes("blog")).slice(0,8);if(sin.length)L.push("Búsquedas que la encuentran en redes pero sin artículo en el blog: "+sin.map(c=>c.k+" ("+String(c.pl)+", "+c.impresiones+" impr)").join("; "));}}
    L.push("Búsquedas por pilar (impresiones): "+Object.entries(r.pilares).map(([k,v])=>k+" "+v.impresiones).join("; "));
    L.push("Top búsquedas: "+g.consultas.slice(0,25).map(x=>x.k+" ("+x.clics+" clics, "+x.impresiones+" impr, pos "+fmt(x.pos,1)+")").join("; "));
    if(r.oport.length)L.push("Oportunidades (pos 4-20): "+r.oport.map(o=>o.k+" (+"+o.gana+" clics posibles)").join("; "));
    L.push("Top páginas: "+g.paginas.slice(0,10).map(x=>x.k.replace(/^https?:\/\/[^/]+/,"")+" ("+x.clics+")").join("; "));
    const al=alzas(P,Q);if(al.length)L.push("Búsquedas en alza vs. período anterior: "+al.slice(0,10).map(a=>a.k+(a.pl?" ["+a.pl+"]":"")+(a.nueva?" (nueva)":" (+"+pct(a.d,0)+")")).join("; "));}
  const pf=S.perfil;if(pf.meta_er||pf.meta_crec||pf.meta_clics)L.push("Metas: interacción "+(pf.meta_er??"-")+"%, crecimiento "+(pf.meta_crec??"-")+"%, clics Google "+(pf.meta_clics??"-"));
  return L.join("\n");
}
async function lecturaCruzada(P){
  const st=$("#st-lectura"),b=$("#b-lectura");b.disabled=true;st.className="status";st.textContent="Claude está cruzando tus datos…";
  const prompt="Eres analista de contenido para creadoras. Lee el documento de marca y los datos del período. Escribe una lectura breve en 4 partes con estos títulos en mayúsculas: LO QUE PASÓ (2 o 3 frases con los números que importan), EL CRUCE (qué dice Google que no dicen las redes, y al revés), RESPUESTA A TUS PREGUNTAS (solo si ella escribió preguntas; si no, omite esta parte) y TRES JUGADAS PARA EL PRÓXIMO MES (cada una con el dato que la justifica, el pilar y un formato concreto). Usa solo los datos entregados; si falta algo dilo, no lo inventes. Máximo 280 palabras. "+noTics()+"\n\nDOCUMENTO DE MARCA:\n"+perfilTexto(false)+"\n\nDATOS:\n"+resumenDatos(P);
  let acc="";const box=document.createElement("div");box.className="prose";b.parentElement.before(box);
  try{const r=await S.sample(prompt,{modelTier:"complex",onText:({text})=>{box.textContent=text;}});acc=r.text.trim();
    await periodRef(P.id).update({lectura:{text:acc,at:new Date().toISOString()}});
  }catch(e){box.remove();b.disabled=false;st.className="status err";st.textContent=e.code==="rate_limited"?"Demasiadas solicitudes; espera un minuto.":"No se pudo generar la lectura.";}
}

/* ===================== TENDENCIAS ===================== */
function alzas(P,Q){
  if(!P?.gsc||!Q?.gsc)return[];
  const prev=new Map(Q.gsc.consultas.map(x=>[norm(x.k),x]));
  return P.gsc.consultas.filter(x=>x.impresiones>=15&&!isBrand(x.k)).map(x=>{const o=prev.get(norm(x.k));
    return o?{k:x.k,pl:x.pl,i:x.impresiones,io:o.impresiones,d:(x.impresiones-o.impresiones)/Math.max(1,o.impresiones),pos:x.pos,nueva:false}:{k:x.k,pl:x.pl,i:x.impresiones,io:0,d:Infinity,pos:x.pos,nueva:true};})
   .filter(x=>x.nueva||(x.d>=0.3&&x.i-x.io>=10)).sort((a,b)=>(b.i-b.io)-(a.i-a.io)).slice(0,20);
}
function renderTendencias(){
  const v=$("#v-tendencias"),P=cur(),Q=prevOf(P),p=S.perfil;let h="";
  if(isPerfilVacio()) h+='<div class="callout amber"><b>Completa tu nicho y pilares en <a href="#marca">Mi marca</a></b><p>Las tendencias se leen contra tu nicho y tu voz.</p></div>';
  if(!P){v.innerHTML=h+'<div class="empty"><h3>Sin datos todavía</h3><p class="note">Carga un período en <a href="#metricas">Métricas</a>. Con dos períodos verás qué búsquedas van en alza.</p></div>';return;}
  h+='<div class="sec"><div class="sec-h"><h2>Hacia dónde va tu audiencia</h2><span class="note">'+esc(fechaCorta(P.desde)+" – "+fechaCorta(P.hasta))+'</span></div><div class="grid2">';
  // alzas GSC
  const al=alzas(P,Q);
  h+='<div class="box"><h3>Búsquedas en alza</h3><p class="note">Consultas de Google que crecieron frente al período anterior. Son la señal más confiable: es tu propia audiencia buscando.</p>';
  if(!Q?.gsc)h+='<p class="note"><b>Necesitas dos períodos con Search Console</b> para ver alzas.</p>';
  else if(!al.length)h+='<p class="note">Sin alzas relevantes este período.</p>';
  else h+='<div class="scroll"><table class="t"><tr><th>Búsqueda</th><th>Canal</th><th>Pilar</th><th class="n">Impr.</th><th class="n">Cambio</th></tr>'+al.slice(0,12).map(a=>'<tr><td>'+esc(a.k)+'</td><td class="note">'+esc(a.pl?String(a.pl).split(",").map(platN).join(", "):"–")+'</td><td class="note">'+esc(classify(a.k)||"–")+'</td><td class="n">'+fmt(a.i)+'</td><td class="n">'+(a.nueva?'<span class="badge g">Nueva</span>':'<span class="up">+'+pct(a.d,0)+'</span>')+'</td></tr>').join("")+'</table></div>';
  h+='</div>';
  // pilares en el tiempo
  const conG=S.periodos.filter(x=>x.gsc).slice(0,6).reverse();const pl=pilares();
  h+='<div class="box"><h3>Tus pilares en el tiempo</h3>';
  if(conG.length<2||!pl.length)h+='<p class="note">'+(pl.length?'Con dos o más períodos verás qué pilar gana terreno en Google.':'Agrega pilares en Mi marca.')+'</p>';
  else{h+=pilarTrend(conG,pl);}
  h+='</div></div></div>';
  // Google Trends
  h+='<div class="sec"><div class="box"><h3>Google Trends de tu nicho <span class="note">(opcional)</span></h3><p class="note">En <a href="https://trends.google.com/trends/explore" target="_blank" rel="noopener">trends.google.com</a> busca hasta 5 temas de tus pilares, elige tu país y "Últimos 12 meses", y descarga con el ícono ⤓ el gráfico <b>Interés a lo largo del tiempo</b> y, si quieres, <b>Búsquedas relacionadas</b>. Súbelos aquí.</p>'+
    (P.trends?.series?trendsChart(P.trends):'')+(P.trends?.relacionadas?'<p class="note"><b>Relacionadas cargadas:</b> '+esc(P.trends.relacionadas.slice(0,200))+'…</p>':'')+
    '<label class="drop" id="drop-gt"><input type="file" id="in-gt" accept=".csv" multiple hidden><b>Suelta los CSV de Google Trends</b><span class="note">multiTimeline.csv y relatedQueries.csv</span></label><span class="status" id="st-gt"></span></div></div>';
  // tendencias del nicho (Claude)
  const T=P.tendencias;
  h+='<div class="sec"><div class="sec-h"><h2>Tendencias del nicho y qué significan para ti</h2></div>'+
    '<p class="note">Claude junta tus búsquedas en alza, Google Trends (si lo subiste), tus piezas top y lo que sabe del nicho, y lo aterriza a tus pilares y tu voz. Cada tendencia dice de dónde sale: <b>tus datos</b> es verificable; <b>conocimiento general</b> conviene confirmarlo antes de apostar fuerte.</p>';
  if(T&&T.items){h+='<div class="cards">'+T.items.map((t,i)=>'<div class="card" style="--pc:'+(t.fuente==="tus datos"?"var(--good)":PC[(i+1)%5])+'"><div class="rail"></div><div class="in"><div class="row"><span class="badge '+(t.fuente==="tus datos"?"g":"a")+'">'+esc(t.fuente||"")+'</span>'+(t.pilar?'<span class="badge">'+esc(t.pilar)+'</span>':'')+'</div><h3>'+esc(t.tendencia)+'</h3><p class="note">'+esc(t.senal||"")+'</p><p>'+esc(t.para_ti||"")+'</p>'+(t.idea?'<div class="callout"><span class="mono">Idea · '+esc(t.formato||"")+'</span><p>'+esc(t.idea)+'</p></div>':'')+'</div></div>').join("")+'</div><span class="note">Generado el '+fechaCorta((T.at||"").slice(0,10))+'.</span>';}
  h+='<div class="row"><button class="btn teal" id="b-tend"'+(S.sample?'':' disabled')+'>'+(T?"Actualizar tendencias":"Leer tendencias de mi nicho")+'</button><span class="status" id="st-tend">'+(S.sample?'':'No disponible en esta vista.')+'</span></div></div>';
  v.innerHTML=h;
  setupDrop("gt",f=>leerTrends(f,P));
  const bt=$("#b-tend");if(bt)bt.addEventListener("click",()=>tendencias(P));
}
function pilarTrend(per,pl){
  const names=pl.map(x=>x.nombre);
  const data=per.map(P=>{const r=calc(P);const tot=Object.values(r.pilares).reduce((s,x)=>s+x.impresiones,0)||1;return {P,v:names.map(n=>(r.pilares[n]?.impresiones||0)/tot)};});
  const W=600,H=180,pl_=36,pr=12,pt=10,pb=26,n=data.length;const mx=Math.max(0.05,...data.flatMap(d=>d.v));
  const x=i=>pl_+(W-pl_-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-v/mx);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Participación de cada pilar en impresiones por período"><line x1="'+pl_+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/><text x="'+(pl_-6)+'" y="'+(pt+10)+'" font-size="11" fill="var(--muted)" text-anchor="end">'+pct(mx,0)+'</text>';
  names.forEach((nm,j)=>{s+='<path d="'+data.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(d.v[j]).toFixed(1)).join(" ")+'" fill="none" stroke="'+PC[j%5]+'" stroke-width="2.5"/>';});
  data.forEach((d,i)=>{if(i===0||i===n-1||n<=4)s+='<text x="'+x(i)+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)" text-anchor="'+(i===0?"start":i===n-1?"end":"middle")+'">'+esc(fechaCorta(d.P.hasta))+'</text>';});
  s+='</svg><div class="legend">'+names.map((nm,j)=>{const a=data[0].v[j],b=data[n-1].v[j];return '<span><i style="background:'+PC[j%5]+'"></i>'+esc(nm)+' '+(b>a+0.02?'<span class="up">▲</span>':b<a-0.02?'<span class="down">▼</span>':'')+'</span>';}).join("")+'</div><p class="note">% de tus impresiones en Google que se lleva cada pilar.</p>';
  return s;
}
async function leerTrends(files,P){
  const st=$("#st-gt");st.className="status";st.textContent="Leyendo…";
  try{const tr={...(P.trends||{})};
    for(const f of files){const t=(await f.text()).replace(/^﻿/,"");const rows=parseCSV(t);
      const hi=rows.findIndex(r=>r.length>1&&/^(semana|week|mes|month|dia|day|fecha|date)/.test(norm(r[0])));
      if(hi>=0){const terms=rows[hi].slice(1).map(s=>s.replace(/:.*$/,"").trim());
        tr.series={terms,rows:rows.slice(hi+1).filter(r=>/^\d{4}-\d{2}/.test(r[0])).map(r=>({k:r[0],v:r.slice(1).map(x=>num(String(x).replace("<",""))||0)}))};}
      else tr.relacionadas=rows.map(r=>r.join(" ")).join("; ").slice(0,4000);}
    tr.at=new Date().toISOString();
    await periodRef(P.id).update({trends:clean(tr)});
    st.className="status ok";st.textContent="Listo, guardado en este período.";
  }catch(e){st.className="status err";st.textContent="No pude leer esos archivos de Google Trends.";}
}
function trendsChart(T){
  const rows=T.series.rows;if(rows.length<2)return"";const W=900,H=180,pl=30,pr=10,pt=10,pb=24,n=rows.length;
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-v/100);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Interés en Google Trends"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(pt+10)+'" font-size="11" fill="var(--muted)" text-anchor="end">100</text>';
  T.series.terms.forEach((t,j)=>{s+='<path d="'+rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(r.v[j]||0).toFixed(1)).join(" ")+'" fill="none" stroke="'+PC[j%5]+'" stroke-width="2"/>';});
  s+='<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+esc(fechaCorta(rows[0].k.slice(0,10)))+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)" text-anchor="end">'+esc(fechaCorta(rows[n-1].k.slice(0,10)))+'</text></svg>';
  const tail=Math.max(1,Math.floor(n/6));
  s+='<div class="legend">'+T.series.terms.map((t,j)=>{const a=rows.slice(0,tail).reduce((s,r)=>s+(r.v[j]||0),0)/tail,b=rows.slice(-tail).reduce((s,r)=>s+(r.v[j]||0),0)/tail;return '<span><i style="background:'+PC[j%5]+'"></i>'+esc(t)+' '+(b>a*1.15?'<span class="up">▲</span>':b<a*0.85?'<span class="down">▼</span>':'')+'</span>';}).join("")+'</div><p class="note">Fuente: Google Trends, interés relativo (100 = máximo del período).</p>';
  return s;
}
function trendsTexto(T){if(!T)return"";let s="";if(T.series){const rows=T.series.rows,tail=Math.max(1,Math.floor(rows.length/6));
  s+="Google Trends (interés relativo, inicio vs. final del período): "+T.series.terms.map((t,j)=>{const a=rows.slice(0,tail).reduce((s,r)=>s+(r.v[j]||0),0)/tail,b=rows.slice(-tail).reduce((s,r)=>s+(r.v[j]||0),0)/tail;return t+" "+Math.round(a)+"→"+Math.round(b);}).join("; ")+"\n";}
  if(T.relacionadas)s+="Búsquedas relacionadas en Google Trends: "+T.relacionadas.slice(0,2500)+"\n";return s;}
async function tendencias(P){
  const st=$("#st-tend"),b=$("#b-tend");b.disabled=true;st.className="status";st.textContent="Claude está leyendo tu nicho…";
  const prompt="Eres estratega de tendencias para creadoras de contenido en Latinoamérica. Con el documento de marca y los datos, identifica 5 tendencias relevantes para su nicho y aterrízalas a ella. Prioriza las que se ven en sus propios datos (búsquedas en alza, Google Trends, piezas top). Puedes sumar tendencias de formato o de conversación del nicho que conozcas, pero márcalas como 'conocimiento general' y no inventes cifras. Cada idea debe sonar a su voz y respetar sus temas tabú.\nDevuelve solo JSON: {\"items\":[{\"tendencia\":string (título corto),\"fuente\":\"tus datos\"|\"conocimiento general\",\"senal\":string (el dato o la observación que la respalda),\"pilar\":string (uno de sus pilares o vacío),\"para_ti\":string (qué significa para ella, 1-2 frases),\"idea\":string (una idea concreta de pieza con gancho, en su voz),\"formato\":string (Reel, carrusel, blog, video largo, story…)}]}. "+noTics()+"\n\nDOCUMENTO DE MARCA:\n"+perfilTexto(false)+"\n\nDATOS:\n"+resumenDatos(P)+"\n"+trendsTexto(P.trends);
  try{const r=await S.sample.json(prompt,{modelTier:"complex"});
    const items=(r.items||[]).slice(0,6).map(x=>({tendencia:String(x.tendencia||""),fuente:x.fuente==="tus datos"?"tus datos":"conocimiento general",senal:String(x.senal||""),pilar:String(x.pilar||""),para_ti:String(x.para_ti||""),idea:String(x.idea||""),formato:String(x.formato||"")}));
    await periodRef(P.id).update({tendencias:{items,at:new Date().toISOString()}});
  }catch(e){b.disabled=false;st.className="status err";st.textContent=e.code==="rate_limited"?"Demasiadas solicitudes; espera un minuto.":"No se pudieron generar las tendencias.";}
}

document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
startI18n();
boot();
